name: Brotli source build

on:
  pull_request:
    paths:
      - records/**/requirements.txt
      - scripts/run_1868_rerun.py
      - scripts/check_brotli.py
      - .github/workflows/brotli.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decoder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          python-version: ${{ matrix.python }}
      - name: Check record pins and build the source package
        run: |
          python scripts/check_brotli.py --write-requirement "$RUNNER_TEMP/brotli.txt"
          uv venv "$RUNNER_TEMP/brotli-venv"
          uv pip install --python "$RUNNER_TEMP/brotli-venv/bin/python" -r "$RUNNER_TEMP/brotli.txt"
      - name: Verify the installed native decoder
        run: '"$RUNNER_TEMP/brotli-venv/bin/python" scripts/check_brotli.py'
